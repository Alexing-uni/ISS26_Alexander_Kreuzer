services:
  wenv:
    container_name: wenv
    image: docker.io/natbodocker/virtualrobotdisi26:1.0
    #image: virtualrobotdisi25:2.1
    ports:
      - 8090:8090 
      - 8091:8091/tcp
      - 8091:8091/udp
    networks:
      - iss-network

  robotoutgui25:
    container_name: robotoutgui25
    image: docker.io/natbodocker/robotoutgui25:1.0
    #image: robotoutgui25:1.0
    ports:
      - 8085:8085/tcp
    networks:
      - iss-network
  
  basicrobot25:
    container_name: basicrobot25
    image: docker.io/natbodocker/basicrobot25:1.0
    #image: basicrobot25:1.0
    mem_limit: 512m
    ports:
      - "8020:8020/tcp"
      - "8020:8020/udp"
    environment:
      - VIRTUAL_ENV=wenv                         #Used by uniborobots.robotSupport.create
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
 #     - SERVICE_HOST=172.31.64.1      #basicrobot25 per app che usano basicrobot in docker
 #     - SERVICE_IP=172.31.64.1
      - MQTTBROKER=mosquitto
    depends_on:
      - wenv  
      - robotoutgui25
    networks:
      - iss-network

networks:
  iss-network:
    external: true

 

