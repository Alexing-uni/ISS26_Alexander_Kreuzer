plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.1.3'
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.5.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'

    // ¡AQUÍ ESTÁ LA CLAVE! Cero referencias a "../"
    implementation files('libs/unibo.basicomm23-1.0.jar')
    implementation files('libs/2p301.jar')
}

application {
    mainClass = 'conway.io.IoJavalin'
}